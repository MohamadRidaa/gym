<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in | Gym One</title>
  <style>
    :root { --ink:#17273e; --muted:#63748a; --accent:#365a9d; --border:#dce4ed; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font: 15px/1.45 'Segoe UI', system-ui, -apple-system, sans-serif;
      color:var(--ink); background:#f5f7fb;
      -webkit-font-smoothing:antialiased;
    }
    .login-container {
      width:min(100%,430px); background:#fff; padding:40px;
      border:1px solid #e3e9f1; border-radius:17px;
      box-shadow:0 14px 56px rgba(22,40,65,.07);
    }
    .logo-container { margin-bottom:26px; }
    .logo-container img { width:56px; height:56px; border-radius:12px; object-fit:cover; }
    h1 { font-size:1.7rem; letter-spacing:-.04em; margin:0 0 5px; font-weight:720; }
    .subtitle { color:var(--muted); margin:0 0 30px; font-size:.94rem; }
    .form-group { margin-bottom:19px; }
    label { display:block; font-size:.83rem; font-weight:650; margin-bottom:8px; }
    input {
      width:100%; padding:13px 14px; border:1px solid var(--border);
      border-radius:9px; background:#fff; font:inherit; color:var(--ink);
      outline:none; transition:border-color .15s, box-shadow .15s;
    }
    input:focus { border-color:#7795c9; box-shadow:0 0 0 3px rgba(54,90,157,.12); }
    input::placeholder { color:#9aa8b8; }
    .btn-login {
      margin-top:6px; padding:13px 16px; width:100%; border:0; border-radius:9px;
      color:white; background:var(--accent); font:inherit; font-weight:650;
      cursor:pointer; transition:background .15s;
    }
    .btn-login:hover { background:#284578; }
    .btn-login:disabled { opacity:.7; cursor:wait; }
    .error-message {
      display:none; padding:11px 13px; border-radius:8px; margin-bottom:18px;
      background:#fdf0f1; border:1px solid #f7d7dc; color:#9d3b49;
      font-size:.85rem;
    }
    .error-message.show { display:block; }
    .footer { margin-top:28px; color:#8492a5; text-align:center; font-size:.78rem; }
    @media (max-width:480px) { .login-container { padding:29px 24px; } }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="logo-container">
      <img src="logo-login.jpg" alt="Gym One logo" />
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to Gym One to manage memberships.</p>
    <div class="error-message" id="errorMessage" role="alert" aria-live="polite"></div>
    <form id="loginForm" autocomplete="on">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" placeholder="Enter your username" required autofocus />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn-login">Sign in</button>
    </form>
    <p class="footer">Gym One · Private administrator access</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const passwordField = document.getElementById('password');
      const errorEl = document.getElementById('errorMessage');
      const submitButton = this.querySelector('button[type="submit"]');
      errorEl.classList.remove('show');
      submitButton.disabled = true;
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password: passwordField.value })
        });
        if (response.ok) {
          window.location.href = '/';
          return;
        }
        errorEl.textContent = 'Incorrect username or password.';
      } catch (err) {
        errorEl.textContent = 'Unable to sign in. Check your connection and try again.';
      }
      errorEl.classList.add('show');
      passwordField.value = '';
      submitButton.disabled = false;
    });
  </script>
</body>
</html>
